<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Smart Expense Tracker{% endblock %}</title>
<link rel="stylesheet" href="/static/css/app.css?v={{ asset_v }}">
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
</head>
<body>
<!-- Phone-only top bar. Hidden by CSS above 760px. -->
<header class="mobile-bar">
  <button class="menu-btn" type="button" id="menu-btn"
          aria-label="Open navigation" aria-expanded="false"
          aria-controls="sidebar" onclick="toggleSidebar()">&#9776;</button>
  <div class="mobile-brand">Smart Expense Tracker</div>
</header>

<!-- Backdrop. Stays in the DOM so the fade works in both directions; taps pass
     through when closed because pointer-events is off. -->
<div class="scrim" id="scrim" onclick="closeSidebar()" aria-hidden="true"></div>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <button class="drawer-close" type="button" aria-label="Close navigation"
            onclick="closeSidebar()">&#10005;</button>
    <div class="brand">
      <div class="brand-icon">&#8377;</div>
      <div>
        <div class="brand-title">SMART<br>EXPENSE<br>TRACKER</div>
        <div class="brand-sub">TRACK EVERY RUPEE</div>
      </div>
    </div>

    <nav class="nav">
      {% for key, icon, label, href in nav_items %}
      <a class="nav-item {% if active == key %}active{% endif %}" href="{{ href }}"
         onclick="closeSidebar()">
        <span class="ico">{{ icon }}</span><span>{{ label }}</span>
      </a>
      {% endfor %}
    </nav>

    <!-- margin-top:auto on .sidebar-footer pins this to the bottom, in normal
         flow, so it can never overlap the nav above it. -->
    <!-- margin-top:auto on .sidebar-footer pins this to the bottom, in normal
         flow, so it can never overlap the nav above it. -->
    <div class="sidebar-footer">
      <div class="profile" id="profile-view">
        <div class="avatar">{{ user_initials }}</div>
        <div class="profile-text">
          <div class="profile-name" title="{{ user_name }}">{{ user_name }}</div>
          <button class="profile-edit" type="button" onclick="toggleNameEdit(true)">
            Edit name</button>
        </div>
      </div>

      <form method="post" action="/profile/name" class="profile profile-form"
            id="profile-edit" style="display:none;">
        <input type="hidden" name="back" value="{{ current_path }}">
        <input type="text" name="name" id="profile-name-input" maxlength="40"
               value="{{ user_name }}" placeholder="Your name" autocomplete="name">
        <div class="profile-form-actions">
          <button class="btn btn-primary btn-icon" type="submit" title="Save">&#10003;</button>
          <button class="btn btn-icon" type="button" title="Cancel"
                  onclick="toggleNameEdit(false)">&#10005;</button>
        </div>
      </form>
    </div>
  </aside>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

</div>
<script src="/static/js/app.js?v={{ asset_v }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
