# Render blueprint. Optional — you can configure the same three settings by hand
# in Render's dashboard. Committing this means the config lives with the code.
services:
  - type: web
    name: smart-expense-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # $PORT is assigned by Render; binding 0.0.0.0 is required or the health
    # check cannot reach the app. No --reload in production.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # requirements.txt pins pandas==2.2.3, which predates Python 3.13 wheels.
      # 3.12 has them, so the build does not try to compile pandas from source.
      - key: PYTHON_VERSION
        value: "3.12.7"
      # sync: false means "prompt me for this, don't store it in the repo".
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
